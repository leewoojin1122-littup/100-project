<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100일 프로젝트</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#DCE0DA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="100일">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#DCE0DA;
    --surface:#F3F5F1;
    --ink:#141A16;
    --muted:#77817A;
    --line:#C3C9C0;
    --empty:#CDD2CA;
    --push:#14514A;
    --squat:#9A4A1E;
    --run:#2B3A8F;
    --alert:#B3261E;
    --radius:3px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-feature-settings:"tnum" 1;
    line-height:1.45;
  }
  #stage{
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(56px + env(safe-area-inset-bottom));
    max-width:520px;
    margin:0 auto;
    display:flex;flex-direction:column;
  }
  .top{order:1} .card{order:2} .wallbox{order:3} .chapters{order:4} .inbody{order:5}

  .eyebrow{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin:0 0 10px;
  }
  .counter{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}
  .counter b{
    font-size:76px;line-height:.82;font-weight:800;letter-spacing:-.05em;
  }
  .counter span{font-size:17px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
  .rate{
    display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;
    font-size:13px;color:var(--muted);font-weight:600;
    border-top:1px solid var(--line);margin-top:16px;padding-top:12px;
  }
  .rate b{color:var(--ink);font-size:15px;font-weight:800}

  section{margin-top:26px}
  .head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:10px;
  }
  .head h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin:0;font-weight:700}
  .head .date{font-size:13px;color:var(--muted);font-weight:600}

  .split{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .split .l{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .split .n{font-size:19px;font-weight:800;letter-spacing:-.02em;display:block;margin-top:1px}
  .split .n em{font-size:11px;font-style:normal;font-weight:700;color:var(--muted);margin-left:3px}
  .split .bar{display:block;height:4px;background:var(--empty);border-radius:2px;margin-top:7px;overflow:hidden}
  .split .bar i{display:block;height:100%;border-radius:2px;transition:width .12s}

  /* 고른 날 */
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 12px 12px;transition:border-color .2s,box-shadow .2s;
  }
  .card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .card .day{font-size:22px;font-weight:800;letter-spacing:-.03em}
  .card .when{font-size:12px;font-weight:700;color:var(--muted)}
  .card .chap{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-top:2px}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .chip{
    font-size:12px;font-weight:800;padding:7px 8px;border-radius:var(--radius);
    border:1px solid var(--line);color:var(--muted);
  }
  .chip small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;margin-top:6px}
  .chip.on{color:#fff;border-color:transparent}
  .chip.on[data-k="p"]{background:var(--push)}
  .chip.on[data-k="s"]{background:var(--squat)}
  .chip.on[data-k="r"]{background:var(--run)}
  .card .memo{font-size:15px;font-weight:800;margin-top:10px;min-height:22px;letter-spacing:-.01em}
  .card .memo:empty::before{content:"—";color:var(--line)}
  .card.hl{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}

  .wall{display:grid;grid-template-columns:22px repeat(10,1fr);gap:4px;align-items:center}
  .rownum{font-size:10px;color:var(--muted);font-weight:700;text-align:right;padding-right:2px}
  .cell{
    aspect-ratio:1;display:flex;gap:1px;padding:0;border:0;background:none;
    cursor:pointer;border-radius:2px;
  }
  .cell i{flex:1;background:var(--empty);border-radius:1px;transition:background .12s}
  .cell.future i{background:#D5D9D2;opacity:.5}
  .cell i.on[data-k="p"]{background:var(--push)}
  .cell i.on[data-k="s"]{background:var(--squat)}
  .cell i.on[data-k="r"]{background:var(--run)}
  .cell.sel{outline:2px solid var(--ink);outline-offset:2px}
  .cell:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .legend{display:flex;gap:14px;margin-top:14px;font-size:11px;color:var(--muted);font-weight:700}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend b{width:9px;height:9px;border-radius:1px;display:block}

  /* 구간 */
  .chapters ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .chapters button{
    width:100%;display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:baseline;
    font:inherit;text-align:left;cursor:pointer;color:var(--ink);
    background:transparent;border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;
  }
  .chapters button.cur{background:var(--surface);border-color:var(--ink)}
  .chapters .rng{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .chapters .t{font-size:13px;font-weight:800}
  .chapters .t small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
  .chapters .c{font-size:12px;font-weight:800}
  .chapters .c em{font-style:normal;color:var(--muted);font-weight:700}

  /* 인바디 */
  .ib{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:baseline}
  .ib .k{font-size:12px;font-weight:700;color:var(--muted)}
  .ib .v{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .ib .v span{color:var(--muted);font-weight:600;margin:0 4px}
  .ib .d{font-size:15px;font-weight:800;text-align:right}
  .ib .twist{color:var(--alert)}
  .ib .tag{
    font-size:10px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--alert);
    border-radius:2px;padding:1px 5px;margin-left:6px;vertical-align:2px;
  }
  .ib-note{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 0}
  .inbody .row{transition:opacity .5s,transform .5s}

  /* 재생 모드: 끝날 때까지 인바디를 숨겼다가 한 줄씩 */
  .playing .inbody .row,.playing .inbody .ib-note{opacity:0;transform:translateY(6px)}
  .playing .inbody .shown{opacity:1;transform:none}
  .playing .cell{cursor:default}

  /* 가로 1920×1080 녹화용: 960×540 무대를 화면에 맞게 키움 */
  body.land{overflow:hidden;height:100vh}
  body.land #stage{
    position:absolute;left:50%;top:50%;width:960px;height:540px;max-width:none;margin:0;
    padding:26px 30px;transform:translate(-50%,-50%) scale(var(--k,1));
    display:grid;grid-template-columns:440px 1fr;grid-template-rows:auto auto 1fr;column-gap:40px;
    grid-template-areas:"wall top" "wall card" "wall inbody";
  }
  body.land .top{grid-area:top}
  body.land .card{grid-area:card;margin-top:16px}
  body.land .wallbox{grid-area:wall;margin:0}
  body.land .inbody{grid-area:inbody;margin-top:16px}
  body.land .chapters{display:none}
  body.land .counter b{font-size:64px}
  body.land .rate{margin-top:12px;padding-top:10px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="stage">

<div class="top">
  <p class="eyebrow">100일 프로젝트 · 6월 26일 → 10월 3일</p>
  <div class="counter"><b id="dayNum">100</b><span id="dayUnit">일 / 100</span></div>
  <div class="rate">
    <span>3종 다 한 날 <b id="done">—</b></span>
    <span>하나라도 한 날 <b id="any">—</b></span>
    <span>최장 연속 <b id="best">—</b></span>
  </div>
  <div class="split" id="split"></div>
</div>

<section class="card" id="card">
  <div class="row1"><span class="day" id="cDay">—</span><span class="when" id="cDate">—</span></div>
  <div class="chap" id="cChap">—</div>
  <div class="chips" id="cChips"></div>
  <div class="memo" id="cMemo"></div>
</section>

<section class="wallbox">
  <div class="head">
    <h2>100일</h2>
    <span class="date" id="wallHint">칸을 누르면 그날 기록</span>
  </div>
  <div class="wall" id="wall"></div>
  <div class="legend">
    <span><b style="background:var(--push)"></b>푸시업</span>
    <span><b style="background:var(--squat)"></b>스쿼트</span>
    <span><b style="background:var(--run)"></b>10km</span>
  </div>
</section>

<section class="chapters">
  <div class="head"><h2>구간</h2><span class="date">3종 다 한 날</span></div>
  <ol id="chapList"></ol>
</section>

<section class="inbody">
  <div class="head"><h2>인바디</h2><span class="date">6월 25일 → 10월 3일</span></div>
  <div class="ib" id="ib"></div>
  <p class="ib-note">살은 빠졌는데, 지방보다 근육이 더 빠졌다.</p>
</section>

</main>

<script>
const START=Date.UTC(2026,5,26);
const DAYMS=86400000;
const WD=['일','월','화','수','목','금','토'];
const KINDS=[['p','푸시업','var(--push)'],['s','스쿼트','var(--squat)'],['r','10km','var(--run)']];

// 100일 기록. 한 줄이 10일, p=푸시업 s=스쿼트 r=10km, -=안 함
const LOG=`
psr psr psr psr psr psr psr psr psr psr
psr psr psr psr psr --- psr psr ps- ---
psr ps- psr ps- psr psr psr p-- psr psr
--r p-r psr --- -s- --- ps- ps- ps- p--
ps- p-r psr ps- ps- psr psr psr ps- ps-
ps- ps- --- psr psr --r --- ps- --- ---
psr --- --r --r --- --- --- --- --- ---
--- --- --- --- --- --- --- --- --- ---
--r --r psr psr psr psr --- psr psr psr
--- --- psr ps- psr --r --r --- --- ---
`.trim().split(/\s+/);

// 1~46일은 노션 체크리스트 메모, 47일부터는 구글포토로 추정한 메모
const MEMO={
  16:'워터파크', 19:'회식', 20:'경산 출장', 22:'제헌절 육아', 24:'주일 여름성경학교 준비',
  28:'피곤함', 29:'간만에 헬스장', 31:'초등부 여름성경학교', 34:'손가락 화상',
  35:'피부과, 서울오토갤러리', 36:'유교전, 장례식장', 37:'넘버블럭스, 계곡',
  47:'손가락 치료 중', 51:'광복절 · 임신 체험복', 53:'임신 체험복 입고 육아',
  60:'가족 휴가', 61:'휴가 중에도 완주', 62:'휴가 마지막 날', 64:'8월 최다 걸음',
  81:'다시 시작', 100:'인바디 재측정'
};

const CHAPTERS=[
  {from:1,  to:15, title:'완벽한 출발', note:'15일 연속 3종 완주'},
  {from:16, to:30, title:'첫 균열',     note:'출장 · 회식 · 육아'},
  {from:31, to:40, title:'여름의 고비', note:'여름성경학교, 손가락 화상'},
  {from:41, to:64, title:'버티기',      note:'휴가 중에도 하루는 완주'},
  {from:65, to:80, title:'공백',        note:'유튜브 하느라 바빴고, 중간에 몸이 아팠다'},
  {from:81, to:90, title:'부활',        note:'열흘 중 7일 완주'},
  {from:91, to:100,title:'마무리',      note:'마지막 사흘은 빈칸'}
];

// 인바디 [이름, 6/25, 10/3, 반전]
const INBODY=[
  ['체중',     68.9, 66.2, false],
  ['체지방량', 12.3, 11.5, false],
  ['골격근량', 32.0, 30.9, true]
];

function rec(n){const t=LOG[n-1]||'---';return {p:t[0]==='p',s:t[1]==='s',r:t[2]==='r'};}
function full(n){const r=rec(n);return r.p&&r.s&&r.r;}
function some(n){const r=rec(n);return r.p||r.s||r.r;}
function dateOf(n){return new Date(START+(n-1)*DAYMS);}
function label(n){const d=dateOf(n);return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 (${WD[d.getUTCDay()]})`;}
function chapterOf(n){return CHAPTERS.find(c=>n>=c.from&&n<=c.to);}
function bestStreak(upto){let b=0,s=0;for(let i=1;i<=upto;i++){s=full(i)?s+1:0;b=Math.max(b,s);}return b;}

const params=new URLSearchParams(location.search);
const PLAY=params.has('play');
const LAND=params.has('land');
const SPEED=Math.max(.25,parseFloat(params.get('speed'))||1);

let upto=100, sel=100, playing=false, paused=false, timer=null;

function renderStats(){
  let done=0,any=0;
  for(let i=1;i<=upto;i++){ if(full(i)) done++; if(some(i)) any++; }
  document.getElementById('dayNum').textContent=upto;
  document.getElementById('dayUnit').textContent=upto===100&&!playing?'일 / 100':'일째 / 100';
  document.getElementById('done').textContent=done+'일';
  document.getElementById('any').textContent=any+'일';
  document.getElementById('best').textContent=bestStreak(upto)+'일';
  document.getElementById('split').innerHTML=KINDS.map(([k,name,color])=>{
    let n=0; for(let i=1;i<=upto;i++) if(rec(i)[k]) n++;
    return `<div><span class="l">${name}</span>`+
           `<span class="n">${n}일<em>/ 100</em></span>`+
           `<span class="bar"><i style="width:${n}%;background:${color}"></i></span></div>`;
  }).join('');
}

function renderCard(){
  const r=rec(sel), c=chapterOf(sel);
  document.getElementById('cDay').textContent='DAY '+sel;
  document.getElementById('cDate').textContent=label(sel);
  document.getElementById('cChap').textContent=`${c.title} · ${c.from}–${c.to}일`;
  document.getElementById('cChips').innerHTML=KINDS.map(([k,name])=>
    `<div class="chip${r[k]?' on':''}" data-k="${k}">${name}<small>${r[k]?'완료':'안 함'}</small></div>`).join('');
  document.getElementById('cMemo').textContent=MEMO[sel]||(sel===c.from&&!some(sel)?c.note:'');
}

function renderWall(){
  const wall=document.getElementById('wall');
  wall.innerHTML='';
  for(let row=0;row<10;row++){
    const g=document.createElement('div');
    g.className='rownum'; g.textContent=row*10+1;
    wall.appendChild(g);
    for(let col=1;col<=10;col++){
      const n=row*10+col;
      const c=document.createElement('button');
      c.className='cell'+(n>upto?' future':'')+(n===sel?' sel':'');
      c.setAttribute('aria-label','DAY '+n+' '+label(n)+(MEMO[n]?' '+MEMO[n]:''));
      KINDS.forEach(([k])=>{
        const i=document.createElement('i');
        i.dataset.k=k;
        if(n<=upto&&rec(n)[k]) i.className='on';
        c.appendChild(i);
      });
      c.onclick=()=>{ if(playing) return; sel=n; render(); };
      wall.appendChild(c);
    }
  }
}

function renderChapters(){
  const cur=chapterOf(sel);
  document.getElementById('chapList').innerHTML=CHAPTERS.map((c,i)=>{
    let d=0; for(let n=c.from;n<=c.to;n++) if(full(n)) d++;
    return `<li><button data-i="${i}" class="${c===cur?'cur':''}">`+
           `<span class="rng">${c.from}–${c.to}일</span>`+
           `<span class="t">${c.title}<small>${c.note}</small></span>`+
           `<span class="c">${d}<em>/${c.to-c.from+1}</em></span></button></li>`;
  }).join('');
  document.querySelectorAll('#chapList button').forEach(b=>{
    b.onclick=()=>{ if(playing) return; sel=CHAPTERS[b.dataset.i].from; render(); };
  });
}

function renderInbody(){
  document.getElementById('ib').innerHTML=INBODY.map(([k,a,b,twist])=>{
    const d=(b-a).toFixed(1);
    return `<span class="k row">${k}${twist?'<span class="tag">반전</span>':''}</span>`+
           `<span class="v row">${a.toFixed(1)}<span>→</span>${b.toFixed(1)}</span>`+
           `<span class="d row${twist?' twist':''}">${d}kg</span>`;
  }).join('');
}

function render(){ renderStats(); renderCard(); renderWall(); renderChapters(); }

// 재생: 하루씩 채우고, 이야기가 있는 날에서 멈춘다
const BASE=110;
const HOLD={16:1400,20:1400,34:1800,61:1600,65:2600,81:1800,100:1200};
function step(){
  if(paused) return;
  upto++; sel=upto;
  render();
  const card=document.getElementById('card');
  const hold=HOLD[upto];
  card.classList.toggle('hl',!!hold);
  if(upto>=100){ finish(); return; }
  timer=setTimeout(step,(hold||BASE)/SPEED);
}
function finish(){
  playing=false;
  render();
  // 인바디는 한 줄씩, 반전(골격근)과 한 줄 평은 한 박자 늦게
  const rows=[...document.querySelectorAll('.inbody .row')];
  const groups=[rows.slice(0,3),rows.slice(3,6),rows.slice(6,9),[document.querySelector('.ib-note')]];
  [600,1500,3300,4600].forEach((t,i)=>setTimeout(()=>groups[i].forEach(r=>r.classList.add('shown')),t/SPEED));
  setTimeout(()=>document.getElementById('card').classList.remove('hl'),1200/SPEED);
}
function play(){
  clearTimeout(timer);
  playing=true; paused=false; upto=0; sel=1;
  document.querySelectorAll('.inbody .shown').forEach(r=>r.classList.remove('shown'));
  document.body.classList.add('playing');
  document.getElementById('wallHint').textContent='';
  render();
  timer=setTimeout(step,900/SPEED);
}

function fit(){
  if(!LAND) return;
  const k=Math.min(innerWidth/960,innerHeight/540);
  document.getElementById('stage').style.setProperty('--k',k);
}

renderInbody();
if(LAND){ document.body.classList.add('land'); fit(); addEventListener('resize',fit); }
if(PLAY){
  play();
  addEventListener('keydown',e=>{
    if(e.key===' '){ e.preventDefault(); if(!playing) return; paused=!paused; if(!paused) step(); }
    if(e.key==='r'||e.key==='R') play();
  });
}else{
  render();
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
